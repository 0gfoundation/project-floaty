<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
<defs>
  <radialGradient id="aura" cx="50%" cy="45%" r="50%">
    <stop offset="0" stop-color="#c26bff" stop-opacity=".75"/>
    <stop offset=".45" stop-color="#9200E1" stop-opacity=".35"/>
    <stop offset="1" stop-color="#9200E1" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ebe6f3"/></linearGradient>
  <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfc7dc"/><stop offset="1" stop-color="#b2a8c4"/></linearGradient>
  <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a09aac"/><stop offset="1" stop-color="#716b7d"/></linearGradient>
  <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#2b0650" flood-opacity=".45"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <clipPath id="scr"><rect x="-160" y="-174" width="320" height="262" rx="34"/></clipPath>
</defs>

<ellipse cx="500" cy="400" rx="440" ry="380" fill="url(#aura)"/>
<circle cx="500" cy="395" r="300" fill="none" stroke="#c995ff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
<ellipse cx="500" cy="828" rx="150" ry="22" fill="#3d0f6b" opacity=".55" filter="url(#blur)"/>

<g transform="translate(500 400) rotate(-6)" filter="url(#drop)">
  <!-- mount: the neck starts inside the head, the feet sit right under it -->
  <rect x="-62" y="150" width="124" height="66" rx="16" fill="#aca6b8"/>
  <rect x="-110" y="196" width="104" height="72" rx="22" fill="url(#mount)"/>
  <rect x="6" y="196" width="104" height="72" rx="22" fill="url(#mount)"/>
  <circle cx="-84" cy="222" r="8" fill="#55505f"/><circle cx="84" cy="222" r="8" fill="#55505f"/>
  <!-- head: a thin darker lip under the front gives thickness without a second box -->
  <rect x="-182" y="-186" width="364" height="384" rx="48" fill="url(#lip)"/>
  <rect x="-182" y="-196" width="364" height="384" rx="48" fill="url(#front)" stroke="#ddd6e8" stroke-width="3"/>
  <!-- screen, same black as the face image so no seam -->
  <rect x="-160" y="-174" width="320" height="262" rx="34" fill="#000000"/>
  <image x="-136" y="-118" width="272" height="204" preserveAspectRatio="xMidYMid meet" clip-path="url(#scr)" href="data:image/png;base64,"/>
  <!-- bezel: blush and a small 0G mark -->
  <ellipse cx="-136" cy="138" rx="20" ry="10" fill="#ff9cc6" opacity=".55"/>
  <ellipse cx="136" cy="138" rx="20" ry="10" fill="#ff9cc6" opacity=".55"/>
