<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
<defs>
  <radialGradient id="aura" cx="50%" cy="45%" r="50%">
    <stop offset="0" stop-color="#c26bff" stop-opacity=".75"/>
    <stop offset=".45" stop-color="#9200E1" stop-opacity=".35"/>
    <stop offset="1" stop-color="#9200E1" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e4f2"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1edf7"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d7d0e3"/><stop offset="1" stop-color="#b5abc6"/></linearGradient>
  <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a95a6"/><stop offset="1" stop-color="#6f6a7b"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset=".4" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#2b0650" flood-opacity=".45"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <clipPath id="scr"><rect x="-150" y="-150" width="300" height="250" rx="30"/></clipPath>
</defs>

<!-- 0G glow, readable on light and dark pages -->
<ellipse cx="500" cy="400" rx="440" ry="380" fill="url(#aura)"/>
<circle cx="500" cy="395" r="300" fill="none" stroke="#c995ff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>

<!-- floating shadow -->
<ellipse cx="500" cy="828" rx="150" ry="22" fill="#3d0f6b" opacity=".55" filter="url(#blur)"/>

<g transform="translate(500 400) rotate(-6)" filter="url(#drop)">
  <!-- servo mount, attached under the head -->
  <rect x="-70" y="168" width="140" height="44" rx="14" fill="#aaa4b6"/>
  <rect x="-118" y="200" width="112" height="74" rx="22" fill="url(#mount)"/>
  <rect x="6" y="200" width="112" height="74" rx="22" fill="url(#mount)"/>
  <circle cx="-92" cy="226" r="8" fill="#55505f"/><circle cx="92" cy="226" r="8" fill="#55505f"/>
  <!-- cube: top and side faces for depth -->
  <rect x="-160" y="-216" width="364" height="384" rx="48" fill="url(#side)"/>
  <!-- front -->
  <rect x="-182" y="-196" width="364" height="384" rx="48" fill="url(#front)" stroke="#dcd5e7" stroke-width="3"/>
  <!-- screen -->
  <rect x="-160" y="-174" width="320" height="270" rx="34" fill="#050407"/>
  <g transform="translate(0 0)">
    <image x="-160" y="-170" width="320" height="262" preserveAspectRatio="xMidYMid slice" clip-path="url(#scr)" href="data:image/png;base64,"/>
  </g>
  <rect x="-160" y="-174" width="320" height="270" rx="34" fill="url(#glass)"/>
  <!-- bezel: blush and a small 0G mark -->
  <ellipse cx="-138" cy="136" rx="20" ry="10" fill="#ff9cc6" opacity=".55"/>
  <ellipse cx="138" cy="136" rx="20" ry="10" fill="#ff9cc6" opacity=".55"/>
  <g transform="translate(-23 116) scale(0.092)">
    <rect x="25" y="25" width="450" height="450" rx="225" fill="#9200E1"/>
    <path d="M72.6 312.28 C41.51 273.63 43.68 216.5 79.08 180.42 C116.8 141.99 177.94 141.99 215.66 180.42 C253.36 218.85 253.36 281.15 215.66 319.58 C179.09 356.84 120.49 357.97 82.59 322.97 L167.85 236.08 L178.09 246.52 L126.03 299.58 C145.48 308.27 169 304.49 184.92 288.27 C205.67 267.13 205.67 232.87 184.92 211.74 C164.18 190.6 130.55 190.6 109.81 211.74 C91.4 230.49 89.33 259.59 103.6 280.68 L72.6 312.28Z" fill="#ffffff"/>
    <path d="M328.96 269.58 V254.86 H449.2 C446.76 305.37 406.84 345.83 357.19 347.97 C300.35 350.44 253.63 302.06 256.91 244.19 C259.83 192.7 303.1 151.84 353.03 151.84 C402.96 151.84 444.01 190.57 448.84 240.15 H405.11 C400.59 215.03 378.99 196 353.03 196 C320.33 196 294.55 226.2 301.1 260.74 C305.15 282.08 321.64 298.83 342.61 302.91 C369.39 308.11 393.5 292.73 402.38 269.58 H328.96Z" fill="#ffffff"/>
  </g>
</g>

<!-- float lines -->
<g stroke="#d3b3ff" stroke-width="8" stroke-linecap="round" fill="none" opacity=".9">
  <path d="M436 742 q-6 18 0 34"/><path d="M500 750 v40"/><path d="M564 742 q6 18 0 34"/>
</g>
<!-- sparkles and hearts -->
<g fill="#ffd45c">
  <path d="M190 250 l12 30 30 12 -30 12 -12 30 -12 -30 -30 -12 30 -12z"/>
  <path d="M806 150 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z"/>
  <path d="M842 560 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z"/>
</g>
<g fill="#ff6fa8">
  <path d="M800 380 c0 -16 25 -16 25 0 c0 -16 25 -16 25 0 c0 18 -25 29 -25 38 c0 -9 -25 -20 -25 -38z"/>
  <path d="M150 480 c0 -11 18 -11 18 0 c0 -11 18 -11 18 0 c0 13 -18 21 -18 27 c0 -6 -18 -14 -18 -27z" opacity=".85"/>
</g>
<circle cx="250" cy="150" r="5" fill="#ffffff"/><circle cx="880" cy="290" r="7" fill="#c9a6ff"/><circle cx="140" cy="640" r="6" fill="#c9a6ff"/>
</svg>