</g>

<g stroke="#d3b3ff" stroke-width="8" stroke-linecap="round" fill="none" opacity=".9">
  <path d="M440 728 q-6 18 0 34"/><path d="M500 736 v40"/><path d="M560 728 q6 18 0 34"/>
</g>
