<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="760" viewBox="0 0 900 760">
<defs>
  <radialGradient id="aura" cx="50%" cy="46%" r="50%"><stop offset="0" stop-color="#b44dff" stop-opacity=".55"/><stop offset=".55" stop-color="#9200E1" stop-opacity=".18"/><stop offset="1" stop-color="#9200E1" stop-opacity="0"/></radialGradient>
  <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e2ee"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9d4e3"/><stop offset="1" stop-color="#bfb8cc"/></linearGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f8a99"/><stop offset="1" stop-color="#6c6776"/></linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3a0a66" flood-opacity=".35"/></filter>
  <clipPath id="scr"><rect x="300" y="178" width="300" height="270" rx="34"/></clipPath>
</defs>
<ellipse cx="450" cy="350" rx="420" ry="330" fill="url(#aura)"/>
<!-- floating shadow -->
<ellipse cx="450" cy="700" rx="150" ry="20" fill="#2a0f45" opacity=".28"/>
<ellipse cx="450" cy="700" rx="95" ry="12" fill="#2a0f45" opacity=".25"/>
<g filter="url(#soft)">
  <!-- servo mount: a short neck and two little feet -->
  <rect x="398" y="514" width="104" height="40" rx="12" fill="#a7a1b2"/>
  <rect x="356" y="548" width="88" height="60" rx="18" fill="url(#base)"/>
  <rect x="456" y="548" width="88" height="60" rx="18" fill="url(#base)"/>
  <circle cx="380" cy="568" r="6" fill="#5b5664"/><circle cx="520" cy="568" r="6" fill="#5b5664"/>
  <!-- head side for depth -->
  <path d="M600 166 q22 8 22 40 v284 q0 30 -22 38 z" fill="url(#side)" opacity=".7"/>
  <!-- head -->
  <rect x="270" y="150" width="342" height="376" rx="56" fill="url(#shell)" stroke="#d6d0e0" stroke-width="3"/>
  <rect x="300" y="178" width="300" height="270" rx="34" fill="#000"/>
  <image x="292" y="182" width="316" height="237" clip-path="url(#scr)" preserveAspectRatio="xMidYMid slice" href="data:image/png;base64,"/>
  <!-- camera dot and button -->
  <circle cx="451" cy="476" r="13" fill="none" stroke="#e8794a" stroke-width="4"/>
  <circle cx="451" cy="476" r="4" fill="#e8794a"/>
  <!-- cheek blush on shell -->
  <ellipse cx="300" cy="470" rx="16" ry="8" fill="#ff9ec7" opacity=".45"/>
  <ellipse cx="584" cy="470" rx="16" ry="8" fill="#ff9ec7" opacity=".45"/>
</g>
<!-- float lines -->
<g stroke="#c9a6ff" stroke-width="7" stroke-linecap="round" opacity=".85">
  <line x1="392" y1="650" x2="392" y2="672"/><line x1="450" y1="656" x2="450" y2="684"/><line x1="508" y1="650" x2="508" y2="672"/>
</g>
<!-- sparkles -->
<g fill="#ffd45c">
  <path d="M190 210 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z"/>
  <path d="M712 128 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/>
</g>
<g fill="#ff6fa8">
  <path d="M724 330 c0 -14 22 -14 22 0 c0 -14 22 -14 22 0 c0 16 -22 26 -22 34 c0 -8 -22 -18 -22 -34z"/>
  <path d="M150 400 c0 -10 16 -10 16 0 c0 -10 16 -10 16 0 c0 12 -16 19 -16 25 c0 -6 -16 -13 -16 -25z" opacity=".8"/>
</g>
<circle cx="760" cy="520" r="7" fill="#c9a6ff"/><circle cx="130" cy="560" r="5" fill="#c9a6ff"/><circle cx="220" cy="120" r="4" fill="#ffffff"/>
</svg>